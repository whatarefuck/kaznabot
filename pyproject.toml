[project]
name = "kaznabot"
version = "0.1.0"
description = "Telegram-бот для учёта общих трат в квартире"
authors = [
    { name = "Bainazar Iulamanov", email = "yappyxy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "langchain-gigachat>=0.5.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]>=2.0.54",
]

[project.scripts]
kaznabot = "kaznabot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "RET",          # return
    "PT",           # pytest style
    "ASYNC",        # asyncio pitfalls
    "RUF",
]
# Тексты бота на русском: кириллица и типографские знаки — не опечатки. Прочие «похожие» символы ruff ловит дальше.
allowed-confusables = [
    "а", "б", "в", "г", "д", "е", "ё", "ж", "з", "и", "й", "к", "л", "м", "н", "о", "п", "р", "с", "т", "у", "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я", "А", "Б", "В", "Г", "Д", "Е", "Ё", "Ж", "З", "И", "Й", "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я", "−", "×", "–", "ℹ",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# У pymupdf нет аннотаций в конструкторах (Document, Rect) — не считаем их вызовы ошибкой, остальное проверяем строго
untyped_calls_exclude = ["pymupdf"]
