# Дополнение к kaznabot.service для сервера, где бот ходит в Telegram через свой Bot API в режиме --local
# (в .env задан TELEGRAM_API_URL). Положить в /etc/systemd/system/kaznabot.service.d/local-api.conf.
#
# В этом режиме файлы чеков лежат на диске и принадлежат root, поэтому сервис запущен от root,
# но без привилегий: диск доступен только на чтение, писать можно только в /var/lib/kaznabot.
[Unit]
After=telegram-bot-api.service
Wants=telegram-bot-api.service

[Service]
DynamicUser=no
CapabilityBoundingSet=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
